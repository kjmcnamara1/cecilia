name: cecilia
title: cecilia
adopt-info: cecilia
summary: Edit and play guitar tab, notation and Gregorian chant
description: |
  A keyboard-first editor and player for guitar tablature, standard notation and
  Gregorian chant. Reads and writes Guitar Pro, MusicXML, MIDI and GABC and plays along
  with a recording.

  `cecilia` is the terminal interface, `cecilia.gui` the window (the desktop entry).
license: MIT OR Apache-2.0
base: core24
grade: stable
confinement: strict

apps:
  cecilia:
    command: bin/cecilia
    extensions: [gnome]
    plugs: [home, removable-media, audio-playback, audio-record, network]
  gui:
    command: bin/cecilia --gui
    extensions: [gnome]
    plugs: [desktop, desktop-legacy, wayland, x11, opengl, home, removable-media, audio-playback, audio-record, network]

parts:
  # The Rust toolchain (rust-version 1.89; Ubuntu's rustc is older) from rustup. The rust plugin
  # should provision rustup itself, but snapcraft before 9.3 fails to in a clean instance
  # (canonical/snapcraft#6330), so this part does it and `cecilia` uses rust-channel: none.
  rust-deps:
    plugin: nil
    build-packages: [curl, ca-certificates]
    override-build: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
      ln -sf "$HOME/.cargo/bin/cargo" "$HOME/.cargo/bin/rustc" /usr/local/bin/

  cecilia:
    after: [rust-deps]
    plugin: rust
    rust-channel: none
    source: .
    rust-path: [crates/cecilia]
    # libclang-dev and g++: signalsmith-stretch builds C++ through bindgen.
    build-packages: [libasound2-dev, pkg-config, libclang-dev, g++]
    stage-packages: [libasound2t64]
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
