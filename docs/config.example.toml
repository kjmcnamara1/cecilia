# cecilia configuration — copy to ~/.config/cecilia/config.toml
# Changes are picked up automatically while cecilia is running (or run :source).
# Every key below is an option named by its dotted path (ui.tab_width, tabline.wrap, ...): set it
# here, on the command line with -o NAME=VALUE, or in the app with :set NAME [VALUE] (:get NAME
# shows it; :set NAME default resets it). -o and :set values last for the session and win over this
# file. Keymaps are the only part that is not an option.

[general]
leader = "<Space>"

[ui]
tab_width = 2            # horizontal spacing of the tab view (1–8)
follow_playback = true   # the cursor and view move with the playhead (red bar) while playing
jk_moves_between_staves = false   # true: j/k go on from a staff's last row into the next staff (default: they stay on the staff, with ledger-line rows above and below; <A-j>/<A-k> change staff)
lyrics_select_cursor = true   # going from a chant score to its lyrics text area puts the caret (Normal mode) on the pitch letter of the note the cursor is on; :lyrics-select (<leader>g) always does
bar_numbers = "system"   # "system": a bar number at the start of each line; "every": every bar is numbered (GUI)
tab_rhythm = "auto"   # rhythm row under tab: "auto" (only when the track has no standard or slash staff), "on" or "off" (:set ui.tab_rhythm on)
highlight_incomplete_bars = false   # draw the staff lines of bars whose beats don't fill the time signature in red (:set ui.highlight_incomplete_bars toggle)
chant_chords = "top"   # chant is monophonic: which note of a chord `:modern-to-chant` and `cecilia convert … .gabc` keep — "top", "bottom", or "error" (refuse the conversion; a message names the chord)
hide_cursor_while_following = true   # …and only the red bar shows then (the edit cursor hides)
layout = "vertical"   # GUI: default score layout of new panes: "page", "vertical" or "horizontal" (:layout, <leader>v)
zoom = 1.0   # GUI: default zoom factor at startup (0.1 to 10; <C-=> <C-->, <C-0> change it)
completion_ignore_case = true   # Tab completion on the command line ignores letter case
picker_position = 25          # how far down the window (percent) the command palette and pickers sit
picker_max_items = 12         # the most candidates the command palette and pickers list at once
frecency = true               # order command completion and the buffer / recent file / workspace pickers by how often and lately each was used (zoxide style), not alphabetically
command_history_size = 500    # command lines kept in the command history (0: no history)
command_history_time = "relative" # the command history shows when a line ran as "5m ago" (relative) or as a date and time (absolute)
completion_fuzzy = true         # …and matches the typed letters in order anywhere ("sd" → sync-detect)
scrollbar = true         # a scrollbar on score panes (right side; bottom in the horizontal layout)
progress_bar = true      # sections, play position and time along the bottom of score panes
tracks_panel = false     # start with the tracks pane (mixer and bar overview) docked at the bottom
properties = false       # show the properties pane (score, track, lyrics) along the right (<leader>p)
palette = false          # show the editing palette (durations, effects, slides, strokes, beams and stems, bar and repeat tools) along the left (<leader>e)
palette_wrap = true      # h/j/k/l, the arrows and Tab wrap around at the palette's edges (off: stop there)
toolbar = true           # the toolbar of common commands at the top of the window (:toolbar, <leader>B)
fretboard = false        # start with a fretboard pane: the notes at the cursor or playhead (<leader>F)
piano = false            # piano keys likewise (<leader>K)
global_tools = ["tracks", "waveform", "fretboard", "piano", "tuner"]   # tool panes docked along the
                         # bottom of the window at full width (showing the last active score);
                         # others open under their score pane and always show it
auto_resize = true       # tracks panes fit their contents' height, until you resize them by hand
focus_ring_width = 4.0 # GUI: thickness in pixels of the ring around the focused pane (0 to 8; 0: none; the terminal UI uses a thick border above 4; :set ui.focus_ring_width N sets it for the session)
focus_ring_color = ""    # color of that ring (#rgb, #rrggbb or #rrggbbaa; "": the current mode's color; :set ui.focus_ring_color #fabe28)
equalize_on_close = true # closing a pane re-equalizes the split it was in (off: the neighbour takes its space; :set ui.equalize_on_close toggle changes it for the session)
keep_files_in_new_view = true # :view-new starts the new view with the current files (as tabline.new_view says; off: with the dashboard, no files)
workspace_autosave_on_quit = true # quitting runs :workspace-save for the active workspace (:quit! never does; no workspace: nothing)
workspace_restore_last = true # `cecilia` with no arguments loads the last workspace (created as "default" if none is saved); off: the dashboard, with no workspace
tracks_peek = 1.0        # seconds the tracks show when the track changes, while no tracks pane is
                         # shown (0: never)
lyrics_font = "Source Sans 3"   # GUI: font of the lyrics text area (properties pane); the app's
                         # text font, or any installed family
lyrics_font_size = 12.0  # GUI: its size in points
chant_text_font = "noto-serif"   # the font of the lyrics of a chant score: noto-serif or source-sans (the
                         # versicle, response, dagger and barred A are Noto Serif's either way)
mark_labels = "exact"          # while ' waits for a mark letter, the marks are drawn on the score: "exact" (where a jump
                         # lands), "above" (over the staff, at that beat) or "off"
waveform_time_ticks = "all"      # GUI waveform pane: the time ruler along the bottom (fixed scale: a tick a second,
                         # a tall one every five): "all", "major" or "off"
waveform_beat_ticks = "all"      # the score ruler along the top (stretches with the sync points; a chant's bars are
                         # the tall ticks, its syllables the short ones): "all", "major" or "off"
waveform_time_labels = true      # label the time ruler's tall ticks (minutes left of the tick, seconds right)
sync_snap = 70.0                # Sync mode: move a new sync point to the strongest onset of the audio within this many
                         # milliseconds (0 to 200; 0: off, exactly where it was put)
waveform_beat_labels = true      # label the score ruler (the bar left of a tall tick, the syllable right)

[tabline]
new_view = "copy"        # a new view starts with: "copy" (this view's buffers), "current", "empty"
icons = "auto"           # terminal icons (file types, and the editing palette's buttons): "auto" (Nerd Font if
                         # the terminal is kitty/WezTerm/Ghostty or fontconfig lists one, else Unicode under a
                         # UTF-8 locale, else "none"), "nerd" (Nerd Font
                         # glyphs, e.g. the music notes), "unicode" (plain music symbols) or "none" (the
                         # palette shows short text labels like "1/8", "PM", "||"; chant notation then uses
                         # ASCII note heads)
hide_single_view = true  # no view indicator on the right while there is only one view
wrap = true              # :buffer-next / :buffer-prev wrap around at the ends (off: stop at the last / first tab; :set tabline.wrap toggle)

[tabline.truncation]
max_width = 28           # longer file names are shortened in the middle…
prefix_width = 14        # …keeping this many characters at the start
suffix_width = 10        # …and this many at the end

[theme]
# A built-in theme: "dark", "light", "nord", "nord-dark", "nord-light", "gruvbox", "solarized-dark", "solarized-light",
# "catppuccin-latte", "catppuccin-frappe", "catppuccin-macchiato", "catppuccin-mocha", or
# the logo's gold/cream on neutral charcoal: "cecilia-dark" (dark UI and page, light engraving), "cecilia"
# (dark UI, light page, black engraving) and "cecilia-light" (light UI and page, black engraving).
# Or the name of a file in the themes folder next to this file ("mine" for themes/mine.toml): it
# has the keys of this section and starts from the theme its own `preset` names (default "dark").
# The built-in ones are in crates/cecilia-app/themes/ in the source: copy one to start.
preset = "dark"
# A theme file with the same keys as this section (absolute, ~/…, or relative to this folder);
# keys here override it. Edits to it apply while cecilia runs.
# file = "themes/mine.toml"
# Any color overrides the preset: "#rrggbb" or "#rrggbbaa". Defaults of the dark theme:
# paper = "#e8e9ec"           # around the engraved pages
# page = "#ffffff"            # the pages
# ink = "#000000"             # the notation (greys are blended between page and ink)
# chrome = "#282a30"          # tabline, status line
# chrome_text = "#e1e1e6"
# dim = "#9698a0"             # secondary text
# accent = "#fabe28"          # active tab, focus; tracks without a color get a spectrum from it
# playhead = "#e12828"
# selection = "#965adc"
# selection_opacity = 22     # how opaque the Visual-mode selection is, 0 to 100 (raise it where it is hard to see)
# cursor_opacity = 43        # how opaque the edit cursor's shade is, 0 to 100 (GUI; dimmer in unfocused panes)
# tab = "#34373f"             # buffer tabs
# tab_hover = "#484b56"
# status_b = "#3c3f49"        # the status line's second sections (layout, progress)
# toolbar = "#2e3037"
# button_hover = "#484b56"
# cursor_border = "#141418"  # outline of the edit cursor (default: contrasts with the page); config-file only, not an option for :set / -o
# capo = "#e1e1e6"            # the capo on the fretboard
# panel = "#1e2025"           # tracks panel, waveform bar
# empty_bar = "#373a42"       # bars without notes in the tracks panel
# incomplete_bar = "#d62828" # staff lines of bars without a full count (highlight_incomplete_bars)
# popover = "#24262c"         # command palette, pickers, tooltips
# error = "#ff6e64"
# lyrics = "#6ec882"          # terminal score view
# marker = "#5abed2"          # terminal score view: headings, beat text
# lyrics_text = "#e1e1e6"     # the lyrics text area (properties pane): the words
# lyrics_text_dim = "#9698a0" # …the words with GABC shown (dimmed)
# lyrics_gabc = "#f0f0f4"     # …the other characters inside a GABC group
# lyrics_label = "#64a0f0"    # …[labels] such as verse numbers, in bold
# lyrics_anchor = "#f05a5a"   # …(bar:beat) anchors
# lyrics_clef, lyrics_division, lyrics_note, lyrics_shape, lyrics_attach, lyrics_space,
# lyrics_markup  # …the parts of GABC in the text area (purple, red, blue, yellow, cyan, gray, green)
# waveform = "#6eaae6"
# loop_region = "#3cbe6e32"
# sync_point = "#fabe28"
# mode_normal = "#5a96e6"     # also mode_insert, mode_visual, mode_command, mode_picker, mode_tracks
# icon_guitar_pro = "#f08c32" # also icon_musicxml, icon_midi, icon_chant, icon_cecilia
# score_modern = "#d68c50"    # the status line's MODERN chip (the CHANT chip uses icon_chant)
# track_colors = ["#e05050", "#e0a030", "#50b060", "#4090e0"]   # instead of the spectrum
# voice_colors = ["#468ce6", "#eb8c32", "#3caa64", "#aa64d2"]   # voices 1-4 (blue, orange, green, purple), in the palette's voice buttons

[statusline]
separators = "arrow"     # terminal: between sections, as lualine: "arrow", "round" or "none"
                         # (the GUI draws rounded chips)

[toolbar]
# The toolbar's buttons: commands as typed after ":", "|" between groups (ui.toolbar shows it).
# items = ["new", "open", "write", "|", "undo", "redo", "|", "play-toggle", "stop",
#          "set ui.follow_playback toggle", "loop-toggle", "metronome", "count-in", "|", "tracks",
#          "properties", "waveform", "piano", "fretboard", "tuner", "split", "vsplit", "|", "command-mode",
#          "pick-keymap"]

[audio]
# soundfont = "~/soundfonts/GeneralUser-GS.sf2"
speed = 1.0              # playback speed multiplier
tuner_a4 = 440.0         # the tuner's reference pitch for A4 (Hz)

[swap]
enabled = true           # keep a recovery copy of buffers with unsaved changes
interval = 5.0           # seconds after the last change before it is written (at most 6x while editing)
auto_recover = true      # opening a file with a newer swap file restores it as unsaved changes
# dir = "~/.local/state/cecilia/swap"   # default: $XDG_STATE_HOME/cecilia/swap, else ~/.local/state/cecilia/swap

[notifications]
anchor = "top_right"     # where cards stack: top_left, top, top_right, right, bottom_right, bottom, bottom_left, left
area = "scores"          # what they sit in: scores (the area of the score panes) or window
info_timeout = 4.0       # seconds an information card stays (0: until dismissed; the bar along its bottom edge shows the time left)
error_timeout = 8.0      # the same for an error card
max_visible = 5          # most cards at once; the rest are counted as "+N more"
history_size = 500       # notifications kept for :notifications (0: no history)
history_time = "relative" # the picker shows when each appeared as "5m ago" (relative) or as a date and time (absolute)

[popups]
opacity = 85             # GUI: how opaque (percent) pickers, the palette and notification cards are (0 to 100)
blur = 20.0              # GUI: how far the page behind them is blurred (pixels; 0: not blurred)
shadow_opacity = 45      # GUI: how dark (percent) the shadow under them is (0: none)
shadow_blur = 15.0       # GUI: how far it is blurred (pixels)
shadow_offset = 7.0      # GUI: how far it is pushed down (pixels)

[score]
clef = "treble"          # clef of a standard staff added without one: treble, bass or grand

# Bindings map key notation to a command, or a list of commands run in order.
# Use "nop" to remove a default binding. Commands are listed in docs/keymap.md.
[keymap.normal]
# "<C-n>" = "track-next"
# "<leader>p" = "play-toggle"
# "gb" = ["goto-first", "play"]
# "<C-S-q>" = "quit!"     # Ctrl+Shift+Q, distinct from <C-q> (GUI, kitty-protocol terminals)
# "<D-s>" = "write"       # Super/Windows/Cmd+S (a buffer with no file opens :save-as)
# <F1> shows the key help of the current mode in every mode; binding it here overrides that in the Normal modes.

# Normal-mode keys for the notation under the cursor, looked up before [keymap.normal]:
# [keymap.normal-tab], [keymap.normal-standard], [keymap.normal-slash], [keymap.normal-chant].
# The defaults put the technique keys (th tb ts ...) on a tab, a smaller set and the accidentals
# (t# t& t=) on a standard staff.
[keymap.normal-tab]
# "tp" = "toggle palm-mute"

[keymap.normal-standard]
# "t%" = "accidental flat"

[keymap.normal-slash]
[keymap.normal-chant]
# Normal mode on a chant score only (`[keymap.chant]` is accepted too). Defaults: the t keys put signs
# on the cursor note: tp ti tv tV ts tq to tu (heads), t~ t< t> (liquescences), tm te tt (mora,
# episema, ictus), tb tn (flat, natural), t* t+ (text), td, td; td: tD (divisions), tc1-tc4 tcb
# tF1-tF4 (clef). Modern-score keys are not taken away: this layer is not looked up elsewhere.

[keymap.insert]
# Insert-mode keys on every staff, e.g. durations. Shared defaults: h j k l move the cursor
# (beat back, string down, string up, beat on), <CR> puts a note at the cursor and moves to the
# next beat (<A-CR> only adds a beat). On a tab H is hammer-on / pull-off and L let ring.
# "<A-8>" = "duration 128"

# Insert-mode keys for the notation under the cursor, looked up before [keymap.insert]:
# [keymap.insert-tab], [keymap.insert-standard], [keymap.insert-slash], [keymap.insert-chant].
[keymap.insert-standard]
# "%" = "accidental flat"

[keymap.tracks]
# Keys while the tracks panel has the focus (<C-w>t).
# "x" = "mute"

[keymap.properties]
# Keys while the properties pane has the focus (<leader>P).
# "d" = "properties-clear"
# "l" = "properties-box +1"   # staff rows: select the clef box (-1: the notation box)
# "<A-l>" = "properties-step +1"   # cycle a choice, switch on, number up (-1: the reverse)

[keymap.palette]
# Keys while the editing palette has the focus (<leader>E). Its buttons run commands, which
# you can bind in other modes too: e.g. "<leader>b" = "beams break", "<leader>s" = "stems up",
# "<leader>f" = "toggle fermata", "<leader>r" = "bar-repeat 1", "<leader>k" = "key G".
# "<CR>" = "palette-activate"

[keymap.sync]
# Keys in Sync mode (:sync), looked up before the Normal-mode keys, of which only motions and
# commands that change nothing work. Defaults: <Esc> leaves, <Space> plays/pauses, <CR> syncs the
# cursor's cell and moves on, u undoes, [ ] { } nudge, y / n set the unit.
# "<CR>" = "sync-tap"

[keymap.design]
# Keys while design mode is on (<leader>d, page layout), looked up before [keymap.normal].
# ">" = "bar-width +20"
# Defaults: + - bars-per-line +1/-1, > < bar-width +10/-10, <A-l> <A-h> beat-nudge +2/-2.

[keymap.command]
# "<C-p>" = "normal"
# "<C-g>" = "set ui.completion_ignore_case toggle"  # toggle case-insensitive completion while typing
# "<C-f>" = "set ui.completion_fuzzy toggle"       # toggle fuzzy completion while typing
