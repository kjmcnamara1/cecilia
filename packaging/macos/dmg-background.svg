<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- Background of the .dmg window (dmg-settings.py places the icons at x 170 and 470, y 185). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF0"/>
      <stop offset="1" stop-color="#F3E8CC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#glow)"/>

  <!-- a faint five-line staff along the bottom -->
  <g stroke="#D9C79B" stroke-width="1" opacity="0.55">
    <line x1="40" y1="318" x2="600" y2="318"/>
    <line x1="40" y1="326" x2="600" y2="326"/>
    <line x1="40" y1="334" x2="600" y2="334"/>
    <line x1="40" y1="342" x2="600" y2="342"/>
    <line x1="40" y1="350" x2="600" y2="350"/>
  </g>

  <!-- arrow from the app to Applications -->
  <g fill="none" stroke="#B89A5E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 185C295 160 345 160 376 182"/>
    <path d="M362 170L378 184L358 190"/>
  </g>

  <text x="320" y="294" text-anchor="middle" fill="#8A7346"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15"
        letter-spacing="0.3">Drag Cecilia into Applications</text>
</svg>
