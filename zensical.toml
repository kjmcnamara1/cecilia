# The website: https://kjmcnamara1.github.io/cecilia/ (built by .github/workflows/pages.yml).
# Preview with `mise run docs`. Pages are the Markdown files in docs/; the home page is
# site-theme/home.html, its styles and the download script are in docs/assets/site/.

[project]
site_name = "cecilia"
site_description = "A keyboard-first editor and player for guitar tab, standard notation and Gregorian chant."
site_url = "https://kjmcnamara1.github.io/cecilia/"
repo_url = "https://github.com/kjmcnamara1/cecilia"
repo_name = "kjmcnamara1/cecilia"
edit_uri = "edit/main/docs/"
copyright = "cecilia is free software under the MIT or Apache 2.0 license."
docs_dir = "docs"
site_dir = "site"
# Internal design notes, not user documentation.
exclude_docs = """
SPEC.md
"""
extra_css = ["assets/site/site.css"]
extra_javascript = ["assets/site/releases.js"]

nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    { "Getting started" = "getting-started.md" },
    { "Download" = "download.md" },
    { "Install" = "INSTALL.md" },
  ] },
  { "Guides" = [
    { "Playing along" = "playing-along.md" },
    { "Chant" = "CHANT.md" },
    { "Lyrics" = "LYRICS.md" },
    { "Configuration" = "configuration.md" },
  ] },
  { "Reference" = [
    { "Key bindings" = "keymap.md" },
    { "Commands" = "COMMANDS.md" },
    { "Options" = "OPTIONS.md" },
    { "Command line" = "command-line.md" },
  ] },
  { "Project" = [
    { "Changelog" = "changelog.md" },
  ] },
]

[project.extra]
generator = false

[project.theme]
custom_dir = "site-theme"
language = "en"
logo = "assets/site/lily.svg"
favicon = "assets/site/lily.svg"
font.text = "Bricolage Grotesque"
font.code = "JetBrains Mono"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
# Lets a page include a file from outside docs/ (the changelog).
pymdownx.snippets = { base_path = ["."], check_paths = true }
