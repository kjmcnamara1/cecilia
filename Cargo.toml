[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.24.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
cecilia-core = { path = "crates/cecilia-core" }
cecilia-formats = { path = "crates/cecilia-formats" }
cecilia-convert = { path = "crates/cecilia-convert" }
cecilia-engrave = { path = "crates/cecilia-engrave" }
cecilia-gui = { path = "crates/cecilia-gui" }
cecilia-audio = { path = "crates/cecilia-audio" }
cecilia-app = { path = "crates/cecilia-app" }
cecilia-tui = { path = "crates/cecilia-tui" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "6"
ratatui = "0.30"
rustysynth = "1.3"
cpal = "0.15"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
