[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.47.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/kjmcnamara1/cecilia"
homepage = "https://github.com/kjmcnamara1/cecilia"
readme = "README.md"
keywords = ["guitar", "tablature", "music-notation", "gregorian-chant", "midi"]
categories = ["multimedia::audio", "text-editors"]

[workspace.dependencies]
cecilia-core = { path = "crates/cecilia-core", version = "0.47.0" }
cecilia-formats = { path = "crates/cecilia-formats", version = "0.47.0" }
cecilia-convert = { path = "crates/cecilia-convert", version = "0.47.0" }
cecilia-engrave = { path = "crates/cecilia-engrave", version = "0.47.0" }
cecilia-gui = { path = "crates/cecilia-gui", version = "0.47.0" }
cecilia-audio = { path = "crates/cecilia-audio", version = "0.47.0" }
cecilia-app = { path = "crates/cecilia-app", version = "0.47.0" }
cecilia-tui = { path = "crates/cecilia-tui", version = "0.47.0" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "6"
ratatui = "0.30"
rustysynth = "1.3"
cpal = "0.15"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
# HTTPS for `:soundfont-install` and the release check: rustls (no OpenSSL), json for the GitHub
# API, no gzip or other extras; flate2 unpacks the SoundFont's .tar.gz.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
flate2 = "1"
sha2 = "0.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
