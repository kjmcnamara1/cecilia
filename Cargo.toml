[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
muse-core = { path = "crates/muse-core" }
muse-formats = { path = "crates/muse-formats" }
muse-convert = { path = "crates/muse-convert" }
muse-engrave = { path = "crates/muse-engrave" }
muse-gui = { path = "crates/muse-gui" }
muse-audio = { path = "crates/muse-audio" }
muse-app = { path = "crates/muse-app" }
muse-tui = { path = "crates/muse-tui" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "6"
ratatui = "0.30"
rustysynth = "1.3"
cpal = "0.15"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
