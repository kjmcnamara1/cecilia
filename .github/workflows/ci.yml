name: CI

# Each job runs a mise task (mise.toml), so `mise run <task>` repeats it locally; `mise run ci`
# runs the Linux ones. The workflow keeps the runners, system packages and caches.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Git Bash on Windows, so the tasks' `bash` is not WSL's.
defaults:
  run:
    shell: bash

jobs:
  # fmt, clippy and the tests. test-corpus/ is not in git, so the tests that read it skip
  # themselves here (the corpus tests in cecilia-formats pass without checking anything).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
      - name: System libraries (ALSA for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: mise run fmt
      - run: mise run clippy
      - run: mise run test

  # The oldest compiler the workspace claims to support (`rust-version` in Cargo.toml); the task
  # installs that toolchain.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: mise run msrv

  # macOS only has to compile for now; the release workflow builds its binaries.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
      - run: mise run check

  # The packaging scripts and metadata (packaging/tests/*.sh). The task installs Ruby, cached
  # after the job (cache_save_post).
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          cache_save_post: true
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin shellcheck desktop-file-utils appstream libxml2-utils jq
      - run: mise run packaging

  # Builds Cecilia.app and the .dmg around a stub binary; the real binary is bundled by the
  # release workflow.
  macos-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: brew install librsvg && pipx install dmgbuild
      - run: mise run macos-bundle

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
      - run: mise run test --locked --no-fail-fast

  # Informational: does the GPU renderer start on hosted macOS and Windows runners? These runners
  # may have no usable GPU, so a failure here is a finding, not a regression (hence
  # continue-on-error). The default renderer (`auto`) must succeed even without a GPU, by ending
  # on the CPU renderer. The CPU renderer (`ui.renderer = cpu`) needs no GPU or graphics API at
  # all, which the first cannot say: the Windows hosted runner has no GPU and the wgpu path
  # segfaults there. The images are uploaded to look at.
  render-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5
      - run: mise run render-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.os }}
          path: |
            render.png
            render-cpu.png
          if-no-files-found: warn
