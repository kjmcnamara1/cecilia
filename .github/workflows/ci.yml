name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # fmt, clippy and the tests. test-corpus/ is not in git, so the tests that read it skip
  # themselves here (the corpus tests in cecilia-formats pass without checking anything).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (ALSA for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # The oldest compiler the workspace claims to support (`rust-version` in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo check --workspace --locked

  # macOS only has to compile for now; the release workflow builds its binaries.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast

  # Informational: does the GPU renderer start on hosted macOS and Windows runners? These runners
  # may have no usable GPU, so a failure here is a finding, not a regression (hence
  # continue-on-error). The second step (`ui.renderer = cpu`) needs no GPU or graphics API at all,
  # which the first cannot say: the Windows hosted runner has no GPU and the wgpu path segfaults
  # there. The images are uploaded to look at.
  render-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Render the start screen headless
        shell: bash
        continue-on-error: true
        run: ./target/release/cecilia -W ci --screenshot render.png
      - name: Render the start screen headless with the CPU renderer (no GPU needed)
        shell: bash
        run: CECILIA_RENDERER=cpu ./target/release/cecilia -W ci --screenshot render-cpu.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.os }}
          path: |
            render.png
            render-cpu.png
          if-no-files-found: warn
