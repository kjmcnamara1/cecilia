[package]
name = "cecilia-app"
description = "Headless application state, commands and keymaps for cecilia"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cecilia-core.workspace = true
cecilia-formats.workspace = true
cecilia-audio.workspace = true
cecilia-convert.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
libc = "0.2"
# The release check (`ui.auto_update`, `:update`): one HTTPS GET of the GitHub API.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
semver = "1"

thiserror.workspace = true
rfd = { version = "0.17", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# The Windows installer's updates (src/update/velopack.rs); the vpk tool the release workflow
# packs with is pinned to the version in Cargo.lock.
velopack = "1.2"

[features]
# The system file picker for `:open` without a file (the frontends turn it on).
dialog = ["dep:rfd"]
