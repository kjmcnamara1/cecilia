[package]
name = "muse-app"
description = "Headless application state, commands and keymaps for muse"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
muse-core.workspace = true
muse-formats.workspace = true
muse-audio.workspace = true
muse-convert.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
thiserror.workspace = true
rfd = { version = "0.17", optional = true }

[features]
# The system file picker for `:open` without a file (the frontends turn it on).
dialog = ["dep:rfd"]
