[package]
name = "cecilia-gui"
description = "Graphical frontend for cecilia (winit + wgpu + vello)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cecilia-core.workspace = true
cecilia-app = { workspace = true, features = ["dialog"] }
cecilia-audio.workspace = true
cecilia-engrave.workspace = true
anyhow.workspace = true
vello = "0.5"
vello_cpu = { version = "0.4", default-features = false, features = ["std", "u8_pipeline"] }
resvg = { version = "0.45", default-features = false }
winit = "0.30"
softbuffer = "0.4"
pollster = "0.4"
tiny-skia = "0.11"
ttf-parser = "0.25"
