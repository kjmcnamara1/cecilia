<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="114 146 284 284" width="512" height="512" role="img" aria-label="Pipe organ">
  <title>Pipe organ</title>
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B77D24"/>
      <stop offset="0.2" stop-color="#E9B83E"/>
      <stop offset="0.42" stop-color="#FFF0A0"/>
      <stop offset="0.62" stop-color="#E9B83E"/>
      <stop offset="1" stop-color="#A87532"/>
    </linearGradient>
    <linearGradient id="ledge-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE39A"/>
      <stop offset="0.45" stop-color="#E6B84F"/>
      <stop offset="1" stop-color="#A87532"/>
    </linearGradient>
    <linearGradient id="trim-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9943D"/>
      <stop offset="0.5" stop-color="#F3CF76"/>
      <stop offset="1" stop-color="#C9943D"/>
    </linearGradient>
    <linearGradient id="fleur-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0A0"/>
      <stop offset="0.55" stop-color="#E6B84F"/>
      <stop offset="1" stop-color="#C9943D"/>
    </linearGradient>
    <linearGradient id="wood-case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E2C14"/>
      <stop offset="1" stop-color="#71421F"/>
    </linearGradient>
    <linearGradient id="wood-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71421F"/>
      <stop offset="0.5" stop-color="#985D2E"/>
      <stop offset="1" stop-color="#7C4A23"/>
    </linearGradient>
    <linearGradient id="pipe-well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A170A" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#2F1A0B"/>
      <stop offset="1" stop-color="#5A3418"/>
    </linearGradient>
    <!-- Soft shadows -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dy="2.4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Fleur-de-lis, drawn around its own centre -->
    <g id="fleur-half">
      <path d="M3.2 8.6C5 1 12-7 20.2-6.2C28.2-5.4 30.4 4.2 25.4 8C21.4 11 16 8 18 3C14.4 2.2 11.4 4.8 9.6 8.6Z"/>
      <path d="M6 11.8C9 11.8 11.8 12.6 13.8 15.2C14.8 16.6 14.4 18.6 13 19C13 16.4 10.4 15 7.8 15.4C6.6 15.6 5.6 15.4 5 15Z"/>
    </g>
    <g id="fleur" fill="url(#fleur-gold)" stroke="#8B5E22" stroke-width="0.6" stroke-linejoin="round">
      <path d="M0-26C7-17 11.4-9 9.2-1C8.2 2.8 5.4 5.6 4.2 8.2L-4.2 8.2C-5.4 5.6-8.2 2.8-9.2-1C-11.4-9-7-17 0-26Z"/>
      <use xlink:href="#fleur-half"/>
      <use xlink:href="#fleur-half" transform="scale(-1,1)"/>
      <path d="M-6 12C-5 16-2.6 20.6 0 25C2.6 20.6 5 16 6 12Z"/>
      <rect x="-11.5" y="7.8" width="23" height="4.2" rx="1.6"/>
      <path d="M0-20C-.6-12-.6-4 0 5" fill="none" stroke="#FFF0A0" stroke-width="0.9" stroke-linecap="round"/>
    </g>
  </defs>
